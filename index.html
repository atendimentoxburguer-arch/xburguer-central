<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="application-name" content="X Burguer Central">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https://api.qrserver.com; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Central operacional da X Burguer para pedidos, PDV, salão, cozinha, delivery, estoque, caixa e gestão.">
  <title>X Burguer Central</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/img/icon.svg">
  <link rel="apple-touch-icon" href="assets/img/logo.png">
  <link rel="preload" href="assets/img/logo.png" as="image">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/domain-management.css">
  <script>
    (function(){
      try{
        var saved=localStorage.getItem('xburguer_theme');
        var theme=saved||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
        document.documentElement.setAttribute('data-bs-theme',theme);
      }catch(e){}
    })();
  </script>
</head>
<body>
<a class="skip-link" href="#appContent">Pular para o conteúdo</a>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navegação principal">
    <div class="brand-foot"><img src="assets/img/logo.png" alt="Logo X Burguer"><div class="txt"><b>X Burguer Central</b><span class="store-pill" id="footStore">ABERTO</span></div></div>
    <button type="button" class="nav-search" onclick="openCommandCenter()"><i class="bi bi-search" aria-hidden="true"></i><span>Buscar uma função</span><kbd>Ctrl K</kbd></button>
    <div id="navigation"></div>
    <div class="sidebar-help"><i class="bi bi-compass" aria-hidden="true"></i><span>Não encontrou?<br><button type="button" onclick="go('inicio')">Ver todas as funções</button></span></div>
  </aside>
  <button type="button" class="sidebar-backdrop" id="sidebarBackdrop" aria-label="Fechar menu" aria-hidden="true" tabindex="-1"></button>
  <main class="main">
    <header class="topbar">
      <div class="brandname">
        <button type="button" class="icon-btn mobile-menu" onclick="toggleSide()" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar"><i class="bi bi-list" aria-hidden="true"></i></button>
        <div class="breadcrumb"><span id="currentGroup">Central</span><b id="currentArea">Início</b></div><span class="badge b-blue connection-status" id="connectionStatus" role="status" aria-live="polite">Dados locais</span>
      </div>
      <div class="topbar-right">
        <div class="store-switch"><span id="storeText">Loja aberta</span><span id="storeToggle" class="toggle on" onclick="toggleStore()" role="switch" aria-label="Abrir ou fechar loja" aria-checked="true" tabindex="0"></span></div>
        <button type="button" class="icon-btn install-btn" id="installAppBtn" hidden title="Instalar aplicativo" aria-label="Instalar aplicativo"><i class="bi bi-box-arrow-down" aria-hidden="true"></i></button>
        <button type="button" class="icon-btn theme-btn" id="themeToggle" onclick="toggleTheme()" title="Alternar tema" aria-label="Alternar tema"><i id="themeIcon" class="bi bi-moon-stars"></i></button>
        <button type="button" class="icon-btn" onclick="showNotifications()" title="Notificações" aria-label="Notificações"><i class="bi bi-bell" aria-hidden="true"></i></button>
        <button type="button" class="icon-btn" onclick="go('config')" title="Configurações" aria-label="Configurações"><i class="bi bi-sliders2" aria-hidden="true"></i></button>
      </div>
    </header>
    <div class="content" id="appContent" tabindex="-1">
      <section class="page active" id="inicio" aria-label="Início"></section>
      <section class="page" id="pedidos" aria-label="Pedidos"></section>
      <section class="page" id="pdv" aria-label="PDV"></section>
      <section class="page" id="salao" aria-label="Salão"></section>
      <section class="page" id="cardapio" aria-label="Cardápio"></section>
      <section class="page" id="entregas" aria-label="Entregas"></section>
      <section class="page" id="performance" aria-label="Desempenho"></section>
      <section class="page" id="kds" aria-label="Cozinha KDS"></section>
      <section class="page" id="clientes" aria-label="Clientes"></section>
      <section class="page" id="marketing" aria-label="Marketing"></section>
      <section class="page" id="atendimento" aria-label="Atendimento"></section>
      <section class="page" id="caixa" aria-label="Caixa"></section>
      <section class="page" id="estoque" aria-label="Estoque"></section>
      <section class="page" id="financeiro" aria-label="Financeiro"></section>
      <section class="page" id="equipe" aria-label="Equipe"></section>
      <section class="page" id="relatorios" aria-label="Relatórios"></section>
      <section class="page" id="config" aria-label="Configurações"></section>
    </div>
  </main>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true"><div class="modal-card" id="modalCard" tabindex="-1"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="assets/js/core.js" defer></script>
<script src="assets/js/ui.js" defer></script>
<script src="assets/js/navigation.js" defer></script>
<script src="assets/js/integrations.js" defer></script>
<script src="assets/js/print-agent-client.js" defer></script>
<script src="assets/js/printing.js" defer></script>
<script src="assets/js/orders.js" defer></script>
<script src="assets/js/sales.js" defer></script>
<script src="assets/js/operations.js" defer></script>
<script src="assets/js/crm.js" defer></script>
<script src="assets/js/management.js" defer></script>
<script src="assets/js/reports.js" defer></script>
<script src="assets/js/salon-management.js" defer></script>
<script src="assets/js/menu-management.js" defer></script>
<script src="assets/js/app.js" defer></script>
<script src="assets/js/pwa.js" defer></script>
</body>
</html>
