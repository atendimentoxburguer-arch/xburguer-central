<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Painel operacional X Burguer para pedidos, PDV, salão, cozinha, delivery e gestão.">
  <title>X Burguer Gestor PRO V10</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
  <script>
    (function(){
      try{
        var saved=localStorage.getItem('xburguer_theme');
        var theme=saved||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
        document.documentElement.setAttribute('data-bs-theme',theme);
      }catch(e){}
    })();
  </script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navegação principal">
    <div class="brand-foot"><img src="assets/img/logo.png" alt="Logo X Burguer"><div class="txt"><b>X Burguer Sanduicheria</b><span class="store-pill" id="footStore">ABERTO</span></div></div>
    <div class="side-search"><input id="sideSearch" type="search" placeholder="Buscar módulo..." aria-label="Buscar módulo"></div>
    <div class="side-title">Seu dia a dia</div>
    <nav class="nav">
      <button type="button" data-page="pedidos" class="active" aria-current="page"><span class="ico"><i class="bi bi-receipt-cutoff"></i></span><span>Meus pedidos</span><span class="count" id="sideNewCount">0</span></button>
      <button type="button" data-page="pdv"><span class="ico"><i class="bi bi-shop-window"></i></span><span>Pedidos balcão (PDV)</span></button>
      <button type="button" data-page="salao"><span class="ico"><i class="bi bi-table"></i></span><span>Pedidos salão</span></button>
      <button type="button" data-page="cardapio"><span class="ico"><i class="bi bi-card-list"></i></span><span>Gestor de cardápio</span></button>
      <button type="button" data-page="entregas"><span class="ico"><i class="bi bi-scooter"></i></span><span>Entregas</span></button>
      <button type="button" data-page="performance"><span class="ico"><i class="bi bi-graph-up-arrow"></i></span><span>Meu desempenho</span></button>
      <button type="button" data-page="kds"><span class="ico"><i class="bi bi-fire"></i></span><span>Cozinha - KDS</span></button>
      <button type="button" data-page="clientes"><span class="ico"><i class="bi bi-people"></i></span><span>Clientes</span></button>
    </nav>
    <div class="side-title">Venda mais</div>
    <nav class="nav">
      <button type="button" data-page="marketing"><span class="ico"><i class="bi bi-stars"></i></span><span>Fidelidade e promoções</span></button>
      <button type="button" data-page="atendimento"><span class="ico"><i class="bi bi-chat-dots"></i></span><span>Atendimento / WhatsApp</span></button>
    </nav>
    <div class="side-title">Gestão avançada</div>
    <nav class="nav">
      <button type="button" data-page="caixa"><span class="ico"><i class="bi bi-cash-register"></i></span><span>Frente de caixa</span></button>
      <button type="button" data-page="estoque"><span class="ico"><i class="bi bi-box-seam"></i></span><span>Estoque</span></button>
      <button type="button" data-page="financeiro"><span class="ico"><i class="bi bi-cash-stack"></i></span><span>Financeiro</span></button>
      <button type="button" data-page="equipe"><span class="ico"><i class="bi bi-person-gear"></i></span><span>Equipe e permissões</span></button>
      <button type="button" data-page="config"><span class="ico"><i class="bi bi-gear"></i></span><span>Configurações</span></button>
    </nav>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="brandname">
        <button type="button" class="icon-btn mobile-menu" onclick="toggleSide()" aria-label="Abrir menu"><i class="bi bi-list"></i></button>
        <img src="assets/img/logo.png" alt="X Burguer"><b>X Burguer Gestor PRO</b><span class="badge b-gray">offline</span>
      </div>
      <div class="topbar-right">
        <div class="store-switch"><span id="storeText">Loja aberta</span><span id="storeToggle" class="toggle on" onclick="toggleStore()" role="switch" aria-label="Abrir ou fechar loja"></span></div>
        <button type="button" class="icon-btn theme-btn" id="themeToggle" onclick="toggleTheme()" title="Alternar tema" aria-label="Alternar tema"><i id="themeIcon" class="bi bi-moon-stars"></i></button>
        <button type="button" class="icon-btn" onclick="toast('Nenhuma notificação crítica.')" title="Notificações" aria-label="Notificações"><i class="bi bi-bell"></i></button>
        <button type="button" class="icon-btn" onclick="go('config')" title="Configurações" aria-label="Configurações"><i class="bi bi-gear"></i></button>
      </div>
    </header>
    <div class="content" id="appContent">
      <section class="page active" id="pedidos" aria-label="Pedidos"></section>
      <section class="page" id="pdv" aria-label="PDV"></section>
      <section class="page" id="salao" aria-label="Salão"></section>
      <section class="page" id="cardapio" aria-label="Cardápio"></section>
      <section class="page" id="entregas" aria-label="Entregas"></section>
      <section class="page" id="performance" aria-label="Desempenho"></section>
      <section class="page" id="kds" aria-label="Cozinha KDS"></section>
      <section class="page" id="clientes" aria-label="Clientes"></section>
      <section class="page" id="marketing" aria-label="Marketing"></section>
      <section class="page" id="atendimento" aria-label="Atendimento"></section>
      <section class="page" id="caixa" aria-label="Caixa"></section>
      <section class="page" id="estoque" aria-label="Estoque"></section>
      <section class="page" id="financeiro" aria-label="Financeiro"></section>
      <section class="page" id="equipe" aria-label="Equipe"></section>
      <section class="page" id="config" aria-label="Configurações"></section>
    </div>
  </main>
</div>
<div class="right-rail" aria-label="Atalhos">
  <button type="button" onclick="go('clientes')" title="Clientes" aria-label="Clientes"><i class="bi bi-people"></i></button>
  <button type="button" onclick="go('entregas')" title="Entregas" aria-label="Entregas"><i class="bi bi-scooter"></i></button>
  <button type="button" onclick="go('salao')" title="Salão" aria-label="Salão"><i class="bi bi-table"></i></button>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true"><div class="modal-card" id="modalCard"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="assets/js/core.js" defer></script>
<script src="assets/js/ui.js" defer></script>
<script src="assets/js/orders.js" defer></script>
<script src="assets/js/sales.js" defer></script>
<script src="assets/js/operations.js" defer></script>
<script src="assets/js/crm.js" defer></script>
<script src="assets/js/management.js" defer></script>
<script src="assets/js/app.js" defer></script>
</body>
</html>
