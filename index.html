<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="application-name" content="X Burguer Central">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Painel operacional X Burguer para pedidos, PDV, salão, cozinha, delivery e gestão.">
  <title>X Burguer Central</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/img/icon.svg">
  <link rel="apple-touch-icon" href="assets/img/logo.png">
  <link rel="preload" href="assets/img/logo.png" as="image">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/v14-management.css">
  <script>
    (function(){
      try{
        var saved=localStorage.getItem('xburguer_theme');
        var theme=saved||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
        document.documentElement.setAttribute('data-bs-theme',theme);
      }catch(e){}
    })();
  </script>
</head>
<body>
<a class="skip-link" href="#appContent">Pular para o conteúdo</a>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navegação principal">
    <div class="brand-foot"><img src="assets/img/logo.png" alt="Logo X Burguer"><div class="txt"><b>X Burguer Sanduicheria</b><span class="store-pill" id="footStore">ABERTO</span></div></div>
    <div class="side-search"><input id="sideSearch" type="search" placeholder="Buscar módulo..." aria-label="Buscar módulo"></div>
    <div class="side-title">Seu dia a dia</div>
    <nav class="nav">
      <button type="button" data-page="pedidos" class="active" aria-current="page"><span class="ico"><i class="bi bi-bag-check"></i></span><span>Meus pedidos</span><span class="count" id="sideNewCount">0</span></button>
      <button type="button" data-page="pdv"><span class="ico"><i class="bi bi-cash-coin"></i></span><span>Pedidos balcão (PDV)</span></button>
      <button type="button" data-page="salao"><span class="ico"><i class="bi bi-grid-3x3-gap"></i></span><span>Pedidos salão</span></button>
      <button type="button" data-page="cardapio"><span class="ico"><i class="bi bi-journal-richtext"></i></span><span>Gestor de cardápio</span></button>
      <button type="button" data-page="entregas"><span class="ico"><i class="bi bi-truck"></i></span><span>Entregas</span></button>
      <button type="button" data-page="performance"><span class="ico"><i class="bi bi-bar-chart-line"></i></span><span>Meu desempenho</span></button>
      <button type="button" data-page="kds"><span class="ico"><i class="bi bi-fire"></i></span><span>Cozinha - KDS</span></button>
      <button type="button" data-page="clientes"><span class="ico"><i class="bi bi-people"></i></span><span>Clientes</span></button>
    </nav>
    <div class="side-title">Venda mais</div>
    <nav class="nav">
      <button type="button" data-page="marketing"><span class="ico"><i class="bi bi-megaphone"></i></span><span>Fidelidade e promoções</span></button>
      <button type="button" data-page="atendimento"><span class="ico"><i class="bi bi-chat-square-dots"></i></span><span>Atendimento / WhatsApp</span></button>
    </nav>
    <div class="side-title">Gestão avançada</div>
    <nav class="nav">
      <button type="button" data-page="caixa"><span class="ico"><i class="bi bi-wallet2"></i></span><span>Frente de caixa</span></button>
      <button type="button" data-page="estoque"><span class="ico"><i class="bi bi-box2"></i></span><span>Estoque</span></button>
      <button type="button" data-page="financeiro"><span class="ico"><i class="bi bi-graph-up-arrow"></i></span><span>Financeiro</span></button>
      <button type="button" data-page="equipe"><span class="ico"><i class="bi bi-person-badge"></i></span><span>Equipe e permissões</span></button>
      <button type="button" data-page="config"><span class="ico"><i class="bi bi-sliders2"></i></span><span>Configurações</span></button>
    </nav>
  </aside>
  <button type="button" class="sidebar-backdrop" id="sidebarBackdrop" aria-label="Fechar menu"></button>
  <main class="main">
    <header class="topbar">
      <div class="brandname">
        <button type="button" class="icon-btn mobile-menu" onclick="toggleSide()" aria-label="Abrir menu"><i class="bi bi-list"></i></button>
        <img src="assets/img/logo.png" alt="X Burguer"><b>X Burguer Central</b><span class="badge b-blue connection-status" id="connectionStatus">Dados locais</span>
      </div>
      <div class="topbar-right">
        <div class="store-switch"><span id="storeText">Loja aberta</span><span id="storeToggle" class="toggle on" onclick="toggleStore()" role="switch" aria-label="Abrir ou fechar loja"></span></div>
        <button type="button" class="icon-btn install-btn" id="installAppBtn" hidden title="Instalar aplicativo" aria-label="Instalar aplicativo"><i class="bi bi-box-arrow-down"></i></button>
        <button type="button" class="icon-btn theme-btn" id="themeToggle" onclick="toggleTheme()" title="Alternar tema" aria-label="Alternar tema"><i id="themeIcon" class="bi bi-moon-stars"></i></button>
        <button type="button" class="icon-btn" onclick="toast('Nenhuma notificação crítica.')" title="Notificações" aria-label="Notificações"><i class="bi bi-bell"></i></button>
        <button type="button" class="icon-btn" onclick="go('config')" title="Configurações" aria-label="Configurações"><i class="bi bi-sliders2"></i></button>
      </div>
    </header>
    <div class="content" id="appContent">
      <section class="page active" id="pedidos" aria-label="Pedidos"></section>
      <section class="page" id="pdv" aria-label="PDV"></section>
      <section class="page" id="salao" aria-label="Salão"></section>
      <section class="page" id="cardapio" aria-label="Cardápio"></section>
      <section class="page" id="entregas" aria-label="Entregas"></section>
      <section class="page" id="performance" aria-label="Desempenho"></section>
      <section class="page" id="kds" aria-label="Cozinha KDS"></section>
      <section class="page" id="clientes" aria-label="Clientes"></section>
      <section class="page" id="marketing" aria-label="Marketing"></section>
      <section class="page" id="atendimento" aria-label="Atendimento"></section>
      <section class="page" id="caixa" aria-label="Caixa"></section>
      <section class="page" id="estoque" aria-label="Estoque"></section>
      <section class="page" id="financeiro" aria-label="Financeiro"></section>
      <section class="page" id="equipe" aria-label="Equipe"></section>
      <section class="page" id="config" aria-label="Configurações"></section>
    </div>
  </main>
</div>
<div class="right-rail" aria-label="Atalhos">
  <button type="button" onclick="go('clientes')" title="Clientes" aria-label="Clientes"><i class="bi bi-people"></i></button>
  <button type="button" onclick="go('entregas')" title="Entregas" aria-label="Entregas"><i class="bi bi-truck"></i></button>
  <button type="button" onclick="go('salao')" title="Salão" aria-label="Salão"><i class="bi bi-grid-3x3-gap"></i></button>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true"><div class="modal-card" id="modalCard" tabindex="-1"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="assets/js/core.js" defer></script>
<script src="assets/js/ui.js" defer></script>
<script src="assets/js/orders.js" defer></script>
<script src="assets/js/sales.js" defer></script>
<script src="assets/js/operations.js" defer></script>
<script src="assets/js/crm.js" defer></script>
<script src="assets/js/management.js" defer></script>
<script src="assets/js/salon-management.js" defer></script>
<script src="assets/js/menu-management.js" defer></script>
<script src="assets/js/app.js" defer></script>
<script src="assets/js/pwa.js" defer></script>
</body>
</html>
