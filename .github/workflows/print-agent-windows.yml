name: Print Agent Windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/print-agent/**'
      - 'assets/img/logo.png'
      - '.github/workflows/print-agent-windows.yml'
  push:
    branches: [main]
    tags:
      - 'print-agent-v*'
    paths:
      - 'apps/print-agent/**'
      - 'assets/img/logo.png'
      - '.github/workflows/print-agent-windows.yml'

permissions:
  contents: write

concurrency:
  group: print-agent-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/print-agent
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Print Agent
        run: npm run check

      - name: Read agent version
        id: agent-version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          "version=$($pkg.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build Windows installer
        run: npm run dist

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: X-Burguer-Print-Agent-Windows
          path: apps/print-agent/dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish Print Agent release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: print-agent-v${{ steps.agent-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: X Burguer Print Agent v${{ steps.agent-version.outputs.version }}
          files: apps/print-agent/dist/*.exe
          generate_release_notes: true
          make_latest: true
