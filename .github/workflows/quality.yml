name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          set -e
          for file in assets/js/*.js service-worker.js scripts/*.mjs apps/print-agent/*.mjs apps/print-agent/lib/*.mjs apps/print-agent/desktop/*.mjs apps/print-agent/desktop/*.js; do
            node --check "$file"
          done
          node --check apps/print-agent/desktop/preload.cjs
      - name: Run static project checks
        run: node scripts/check.mjs
      - name: Architecture contract tests
        run: node scripts/architecture-contracts.mjs
      - name: Visual contract tests
        run: node scripts/visual-contracts.mjs
      - name: State contract tests
        run: node scripts/state-contracts.mjs
      - name: Reports contract tests
        run: node scripts/reports-contracts.mjs
      - name: Business contract tests
        run: node scripts/business-contracts.mjs
      - name: Salon and checkout contract tests
        run: node scripts/salon-checkout-contracts.mjs
      - name: Printing contract tests
        run: node scripts/printing-contracts.mjs
      - name: Print agent contract tests
        run: node scripts/print-agent-contracts.mjs
      - name: Print agent service contract tests
        run: node scripts/print-agent-service-contracts.mjs

  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Check screens and critical interactions
        run: node scripts/browser-check.cjs
      - name: Install connected platform dependencies
        run: npm ci --prefix apps/platform
      - name: Check migration, connected POS and public ordering in browser
        run: node scripts/platform-browser-check.cjs

  platform-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: xburguer
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: xburguer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xburguer -d xburguer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json
      - run: npm ci --prefix apps/platform
      - name: Test platform against PostgreSQL
        working-directory: apps/platform
        env:
          TEST_DATABASE_URL: postgres://xburguer:ci-only-password@localhost:5432/xburguer_test
        run: npm test
