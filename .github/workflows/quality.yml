name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          set -e
          for file in assets/js/*.js service-worker.js scripts/*.mjs; do
            node --check "$file"
          done
      - name: Run static project checks
        run: node scripts/check.mjs
