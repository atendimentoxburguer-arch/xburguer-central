<link rel="stylesheet" href="assets/css/commerce.css"><title>Faça seu pedido — X Burguer</title></head><body><main class="commerce"><header class="commerce-header"><img src="assets/img/logo.png" alt="X Burguer"><div><h1 id="storeName">Cardápio X Burguer</h1><p id="storeStatus">Carregando cardápio…</p></div></header><p id="shopMessage" role="status" aria-live="polite"></p><div class="commerce-layout"><section aria-label="Produtos"><div class="field"><label for="productSearch">Buscar no cardápio</label><input id="productSearch" type="search" placeholder="Qual vai ser o pedido de hoje?"></div><div id="catalog" class="commerce-products"></div></section><aside class="card commerce-cart"><h2>Seu pedido</h2><div id="cart"></div><p id="cartTotal"></p><form id="checkout"><div class="field"><label for="name">Seu nome</label><input id="name" name="name" required maxlength="120" autocomplete="name"></div><div class="field"><label for="phone">Telefone com DDD</label><input id="phone" name="phone" type="tel" autocomplete="tel" required></div><div class="field"><label for="type">Como deseja receber?</label><select id="type" name="type"><option>Retirada</option><option>Delivery</option></select></div><div class="field" id="addressField" hidden><label for="address">Endereço completo</label><input id="address" name="address" autocomplete="street-address" maxlength="300"></div><div class="field"><label for="coupon">Cupom</label><input id="coupon" name="coupon" maxlength="32"></div><div class="field"><label for="scheduledAt">Agendar (opcional)</label><input id="scheduledAt" name="scheduledAt" type="datetime-local"></div><div class="field"><label for="notes">Observações</label><textarea id="notes" name="notes" maxlength="500"></textarea></div><p class="muted">Pagamento combinado com a loja. Este cardápio ainda não cobra online.</p><button class="btn btn-primary" id="sendOrder">Enviar pedido</button></form></aside></div></main><script src="assets/js/runtime.js" defer></script><script src
